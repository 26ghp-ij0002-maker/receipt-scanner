<!DOCTYPE html>
<html>
<head>
    <title>동호회 영수증 관리자</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; }
        .upload-box { border: 2px dashed #ccc; padding: 30px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <h1>🧾 영수증 스캐너</h1>
    <p>영수증 사진을 올리면 자동으로 정리해 드려요.</p>

    <div class="upload-box">
        <input type="file" id="receipt-image" accept="image/*">
    </div>

    <button onclick="processReceipt()">영수증 분석하기</button>

    <div id="result-area">
    </div>

    <script>
        function processReceipt() {
            // 1. 화면에 있는 사진 입력 칸을 찾아서 'imageInput'이라는 상자에 담습니다.
            const imageInput = document.getElementById('receipt-image');

            // 2. 만약(if) 사용자가 사진을 고르지 않았다면?
            if (imageInput.files.length === 0) {
                alert("앗! 영수증 사진을 먼저 올려주세요!");
                return; // 사진이 없으니 여기서 동작을 멈춥니다.
            }

            // 3. 사진을 무사히 골랐다면, 첫 번째 사진을 'receiptFile'이라는 상자에 담습니다.
            const receiptFile = imageInput.files[0];
            
            // 4. 파일의 이름을 확인하는 안내창을 띄웁니다.
            alert("좋습니다! 선택하신 파일 이름은 '" + receiptFile.name + "' 입니다. \n이제 이 사진을 AI에게 보낼 준비가 되었습니다!");
            
            // (다음 단계: 여기에 제미나이 AI와 연결해서 글자를 읽어오는 코드를 추가할 예정입니다.)
        }
    </script>

</body>
</html>
