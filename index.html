<!DOCTYPE html>
<html>
<head>
    <title>동호회 영수증 관리자</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; }
        .upload-box { border: 2px dashed #ccc; padding: 30px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <h1>🧾 영수증 스캐너</h1>
    <p>영수증 사진을 올리면 자동으로 정리해 드려요.</p>

    <div class="upload-box">
        <input type="file" id="receipt-image" accept="image/*">
    </div>

    <button onclick="processReceipt()">영수증 분석하기</button>

    <div id="result-area">
    </div>

    <script>
<style>
    /* (기존 스타일 유지) */
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
    th { background-color: #f4f4f4; }
</style>

<script>
    // ⚠️ 주의: 실제 앱에서는 API 키를 여기에 직접 쓰면 위험하지만, 
    // 지금은 공부 단계이므로 가장 쉬운 방법으로 진행합니다!
    const API_KEY = AIzaSyAK406ojjRZW9LYfDgXLyzuSoT0zxmzbjg

    async function processReceipt() {
        const imageInput = document.getElementById('receipt-image');
        const resultArea = document.getElementById('result-area');

        if (imageInput.files.length === 0) {
            alert("영수증 사진을 먼저 올려주세요!");
            return;
        }

        const file = imageInput.files[0];
        resultArea.innerHTML = "<p>AI가 영수증을 분석 중입니다... 잠시만 기다려주세요. ☕</p>";

        // 1. 사진 파일을 AI가 이해할 수 있는 형태(Base64)로 바꿉니다.
        const base64Image = await fileToBase64(file);

        // 2. 제미나이 AI에게 보낼 "명령어"와 "사진"을 준비합니다.
        const prompt = "이 영수증 이미지에서 '일자', '내역', '금액'을 추출해서 JSON 형식으로 답해줘. 금액은 숫자만 추출해줘.";
        
        try {
            // 3. AI에게 요청을 보냅니다 (fetch)
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: 'POST',
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: file.type, data: base64Image } }] }]
                })
            });

            const data = await response.json();
            const aiResponse = data.candidates[0].content.parts[0].text;

            // 4. 결과를 화면에 표로 그려줍니다.
            displayResult(aiResponse);

        } catch (error) {
            alert("에러가 발생했어요: " + error.message);
            resultArea.innerHTML = "";
        }
    }

    // 사진을 텍스트 데이터로 변환하는 마법의 함수
    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    // 결과를 화면에 표로 보여주는 함수
    function displayResult(text) {
        const resultArea = document.getElementById('result-area');
        // AI가 준 텍스트에서 깔끔하게 표를 만드는 코드가 여기에 들어갑니다.
        // 우선은 AI가 분석한 내용을 그대로 보여줄게요.
        resultArea.innerHTML = `<h3>분석 결과</h3><pre>${text}</pre>`;
    }
</script>
    </script>

</body>
</html>
